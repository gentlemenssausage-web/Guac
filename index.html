<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥑 Guacamole Converter</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f0f4e8 0%, #e0edd0 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef } = React;

    const GROQ_RECIPE_KEY = "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";
    const GROQ_VISION_KEY = "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";

    async function groqPost(apiKey, body) {
      const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST", mode: "cors",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error("Groq " + r.status + ": " + await r.text());
      return r.json();
    }

    async function describeImage(base64, mime) {
      const data = await groqPost(GROQ_VISION_KEY, {
        model: "qwen/qwen3.6-27b",
        max_tokens: 200,
        messages: [{
          role: "user",
          content: [
            { type: "image_url", image_url: { url: "data:" + mime + ";base64," + base64 } },
            { type: "text", text: "Describe in 2 sentences exactly what specific objects, colors, and textures are in this image. Be very precise." }
          ]
        }]
      });
      return data.choices[0].message.content.trim();
    }

    async function generateRecipe(imageDescription) {
      const prompt = `You are a completely unhinged guacamole recipe writer.

The image contains: ${imageDescription}

Write a guacamole recipe that treats the SPECIFIC things in this image as guacamole ingredients. Reference real parts of what you see.

Examples:
- Dell laptop in a box -> "peel back the white plastic Dell lid to reveal the guac flesh inside the chassis"
- Birthday card with old man -> "peel back the birthday man's white beard to reveal the avocado flesh beneath"
- Windows settings -> "drain the RAM coolant as your lime juice, mash the CPU cores"

Be absurd, specific, funny. Respond ONLY with raw JSON, start with { end with }:
{"title":"ridiculous title","servings":"weird serving size","steps":["step 1","step 2","step 3","step 4","step 5"],"warning":"⚠️ unhinged warning"}`;

      const data = await groqPost(GROQ_RECIPE_KEY, {
        model: "llama-3.3-70b-versatile",
        max_tokens: 700,
        messages: [{ role: "user", content: prompt }]
      });
      const text = data.choices[0].message.content.trim();
      const match = text.match(/\{[\s\S]*\}/);
      if (!match) throw new Error("No JSON: " + text.slice(0, 100));
      return JSON.parse(match[0]);
    }

    // Generate a procedural guacamole texture — completely different every time
    function generateGuacTexture(w, h) {
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      const img = ctx.createImageData(w, h);
      const d = img.data;

      // Guac color palette: dark olive to bright lime
      const guacColors = [
        [20, 35, 5],   // nearly black olive
        [45, 65, 8],   // very dark green
        [72, 95, 15],  // dark avocado
        [95, 125, 20], // medium avocado
        [130, 165, 30],// classic guac
        [160, 200, 40],// bright guac
        [185, 220, 55],// light guac
        [210, 235, 75],// lime highlight
        [55, 40, 10],  // brown pit chunk
        [80, 55, 12],  // darker brown
        [110, 80, 18], // medium brown
        [35, 28, 6],   // very dark brown
      ];

      // Fill with layered noise — Perlin-like using sin/cos harmonics
      const seed1 = Math.random() * 1000;
      const seed2 = Math.random() * 1000;
      const seed3 = Math.random() * 1000;
      const freq1 = 0.015 + Math.random() * 0.02;
      const freq2 = 0.04  + Math.random() * 0.03;
      const freq3 = 0.08  + Math.random() * 0.05;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          // Multi-octave noise using trig (no perlin needed)
          const n =
            Math.sin((x + seed1) * freq1) * Math.cos((y + seed1) * freq1) * 0.5 +
            Math.sin((x + seed2) * freq2 + y * 0.01) * Math.cos((y + seed2) * freq2) * 0.3 +
            Math.sin((x + seed3) * freq3) * Math.sin((y + seed3) * freq3 + x * 0.01) * 0.2;

          // Normalize to 0-1
          const t = (n + 1) / 2;

          // Map to color index
          const ci = Math.floor(t * (guacColors.length - 1));
          const frac = t * (guacColors.length - 1) - ci;
          const c0 = guacColors[ci];
          const c1 = guacColors[Math.min(ci + 1, guacColors.length - 1)];

          const i = (y * w + x) * 4;
          d[i]   = Math.round(c0[0] + (c1[0] - c0[0]) * frac);
          d[i+1] = Math.round(c0[1] + (c1[1] - c0[1]) * frac);
          d[i+2] = Math.round(c0[2] + (c1[2] - c0[2]) * frac);
          d[i+3] = 255;
        }
      }

      // Paint random brown pit blobs
      const numBlobs = 40 + Math.floor(Math.random() * 60);
      for (let b = 0; b < numBlobs; b++) {
        const bx = Math.floor(Math.random() * w);
        const by = Math.floor(Math.random() * h);
        const br = 4 + Math.floor(Math.random() * 18);
        const bColor = guacColors[8 + Math.floor(Math.random() * 4)]; // brown range
        for (let dy = -br; dy <= br; dy++) {
          for (let dx = -br; dx <= br; dx++) {
            if (dx*dx + dy*dy > br*br) continue;
            const px = bx+dx, py = by+dy;
            if (px < 0 || px >= w || py < 0 || py >= h) continue;
            const dist = Math.sqrt(dx*dx+dy*dy) / br;
            const blend = Math.max(0, 1 - dist * 1.5); // soft edge
            const i = (py*w+px)*4;
            d[i]   = Math.round(d[i]   * (1-blend) + bColor[0] * blend);
            d[i+1] = Math.round(d[i+1] * (1-blend) + bColor[1] * blend);
            d[i+2] = Math.round(d[i+2] * (1-blend) + bColor[2] * blend);
          }
        }
      }

      // Paint bright lime highlight streaks
      const numStreaks = 20 + Math.floor(Math.random() * 30);
      for (let s = 0; s < numStreaks; s++) {
        const sx = Math.floor(Math.random() * w);
        const sy = Math.floor(Math.random() * h);
        const sr = 2 + Math.floor(Math.random() * 8);
        const sColor = [200 + Math.floor(Math.random()*30), 225 + Math.floor(Math.random()*10), 50 + Math.floor(Math.random()*30)];
        for (let dy = -sr; dy <= sr; dy++) {
          for (let dx = -sr; dx <= sr; dx++) {
            if (dx*dx + dy*dy > sr*sr) continue;
            const px = sx+dx, py = sy+dy;
            if (px < 0 || px >= w || py < 0 || py >= h) continue;
            const blend = 0.5;
            const i = (py*w+px)*4;
            d[i]   = Math.round(d[i]   * (1-blend) + sColor[0] * blend);
            d[i+1] = Math.round(d[i+1] * (1-blend) + sColor[1] * blend);
            d[i+2] = Math.round(d[i+2] * (1-blend) + sColor[2] * blend);
          }
        }
      }

      ctx.putImageData(img, 0, 0);
      return d;
    }

    // THE CORE ALGORITHM
    // 1. Get luminance of every source pixel
    // 2. Generate unique guac texture
    // 3. Sort source pixel indices by luminance
    // 4. Sort guac pixel indices by luminance
    // 5. Map source[rank] -> guac[rank] (1:1 luminance match)
    // 6. Place guac pixel back at original source position
    // Result: image structure preserved, every pixel is a real guac pixel
    function applyGuacPixelRemap(ctx, w, h, setStatus) {
      setStatus("Generating guac texture...");
      const src = ctx.getImageData(0, 0, w, h);
      const sd = src.data;
      const total = w * h;

      // Generate unique guac texture same size as source
      const guacData = generateGuacTexture(w, h);

      setStatus("Sorting pixels by luminance...");

      // Compute luminance for every source pixel
      const srcLums = new Float32Array(total);
      for (let i = 0; i < total; i++) {
        srcLums[i] = sd[i*4]*0.299 + sd[i*4+1]*0.587 + sd[i*4+2]*0.114;
      }

      // Compute luminance for every guac pixel
      const guacLums = new Float32Array(total);
      for (let i = 0; i < total; i++) {
        guacLums[i] = guacData[i*4]*0.299 + guacData[i*4+1]*0.587 + guacData[i*4+2]*0.114;
      }

      // Sort indices by luminance
      const srcOrder  = Array.from({length: total}, (_, i) => i).sort((a, b) => srcLums[a]  - srcLums[b]);
      const guacOrder = Array.from({length: total}, (_, i) => i).sort((a, b) => guacLums[a] - guacLums[b]);

      setStatus("Remapping pixels...");

      // Build output: for each rank, put guac pixel at the source pixel's position
      const out = ctx.createImageData(w, h);
      const od = out.data;

      for (let rank = 0; rank < total; rank++) {
        const srcPos  = srcOrder[rank];   // where this pixel lives in the source
        const guacPos = guacOrder[rank];  // guac pixel with same luminance rank

        od[srcPos*4]   = guacData[guacPos*4];
        od[srcPos*4+1] = guacData[guacPos*4+1];
        od[srcPos*4+2] = guacData[guacPos*4+2];
        od[srcPos*4+3] = 255;
      }

      ctx.putImageData(out, 0, 0);
    }

    function App() {
      const [originalSrc, setOriginalSrc] = useState(null);
      const [processedSrc, setProcessedSrc] = useState(null);
      const [recipe, setRecipe] = useState(null);
      const [loading, setLoading] = useState(false);
      const [status, setStatus] = useState("");
      const canvasRef = useRef(null);

      async function handleUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        setLoading(true);
        setRecipe(null);
        setProcessedSrc(null);

        const reader = new FileReader();
        reader.onload = async (ev) => {
          const src = ev.target.result;
          setOriginalSrc(src);
          const base64 = src.split(",")[1];
          const mime = file.type || "image/jpeg";

          const img = new Image();
          img.onload = async () => {
            const canvas = canvasRef.current;
            const MAX = 600;
            const scale = Math.min(1, MAX / Math.max(img.width, img.height));
            canvas.width  = Math.round(img.width  * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // Describe image for recipe
            setStatus("Analyzing image...");
            let desc = "an unidentified object";
            try { desc = await describeImage(base64, mime); } catch(e) { console.warn("Vision:", e.message); }

            // THE REMAP
            applyGuacPixelRemap(ctx, canvas.width, canvas.height, setStatus);
            setProcessedSrc(canvas.toDataURL());

            // Generate recipe
            setStatus("Generating recipe...");
            try {
              const r = await generateRecipe(desc);
              setRecipe(r);
            } catch(e) {
              console.error(e);
              setRecipe({
                title: "Guacamole (something broke)",
                servings: "serves 0",
                steps: ["Error: " + e.message],
                warning: "⚠️ The guac oracle is temporarily unhinged."
              });
            }
            setLoading(false);
            setStatus("");
          };
          img.src = src;
        };
        reader.readAsDataURL(file);
      }

      const s = {
        wrap: { maxWidth: 1100, margin: "0 auto" },
        h1: { fontSize: 52, color: "#2d5016", textAlign: "center", marginBottom: 8, fontWeight: 900 },
        sub: { fontSize: 18, color: "#558b2f", textAlign: "center", marginBottom: 40 },
        btnWrap: { display: "flex", justifyContent: "center", marginBottom: 40 },
        btn: { padding: "18px 40px", background: "#558b2f", color: "white", borderRadius: 10, fontSize: 18, fontWeight: "bold", cursor: "pointer", border: "none", boxShadow: "0 4px 12px rgba(85,139,47,0.4)" },
        grid: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, marginBottom: 30 },
        box: { background: "white", borderRadius: 12, overflow: "hidden", boxShadow: "0 4px 16px rgba(0,0,0,.12)" },
        boxLabel: { padding: "12px 16px", background: "#f5f5f5", fontWeight: "bold", color: "#558b2f", fontSize: 14, letterSpacing: 1 },
        img: { width: "100%", maxHeight: 450, objectFit: "contain", display: "block" },
        recipeBox: { background: "white", padding: 36, borderRadius: 12, boxShadow: "0 4px 16px rgba(0,0,0,.12)" },
        title: { fontSize: 28, color: "#2d5016", marginBottom: 8, fontWeight: 800, lineHeight: 1.3 },
        serving: { color: "#666", fontStyle: "italic", marginBottom: 20, fontSize: 15 },
        stepsLabel: { fontSize: 16, color: "#558b2f", fontWeight: "bold", marginBottom: 10, textTransform: "uppercase", letterSpacing: 1 },
        ol: { paddingLeft: 22, color: "#333", lineHeight: 2 },
        li: { marginBottom: 10 },
        warn: { marginTop: 24, paddingTop: 18, borderTop: "1px solid #eee", color: "#888", fontSize: 14 },
      };

      return (
        <div style={s.wrap}>
          <h1 style={s.h1}>🥑 Guacamole Converter</h1>
          <p style={s.sub}>Transform any image into a guacamole recipe</p>
          <div style={s.btnWrap}>
            <label>
              <input type="file" accept="image/*" onChange={handleUpload} style={{display:"none"}} />
              <span style={s.btn}>{loading ? "🥑 " + status : "📸 Choose Image"}</span>
            </label>
          </div>

          {(originalSrc || processedSrc) && (
            <div style={s.grid}>
              <div style={s.box}>
                <div style={s.boxLabel}>ORIGINAL</div>
                {originalSrc && <img src={originalSrc} style={s.img} alt="original" />}
              </div>
              <div style={s.box}>
                <div style={s.boxLabel}>GUACAMOLE'D ✨</div>
                {processedSrc && <img src={processedSrc} style={s.img} alt="processed" />}
              </div>
            </div>
          )}

          {recipe && (
            <div style={s.recipeBox}>
              <div style={s.title}>{recipe.title}</div>
              <div style={s.serving}>{recipe.servings}</div>
              <div style={s.stepsLabel}>Instructions</div>
              <ol style={s.ol}>
                {recipe.steps.map((step, i) => <li key={i} style={s.li}>{step}</li>)}
              </ol>
              <div style={s.warn}>{recipe.warning}</div>
            </div>
          )}

          <canvas ref={canvasRef} style={{display:"none"}} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
