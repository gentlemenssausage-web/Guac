<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥑 Guacamole Converter</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8f5e9 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    function GuacamoleConverter() {
      const [originalImage, setOriginalImage] = useState(null);
      const [processedImage, setProcessedImage] = useState(null);
      const [recipe, setRecipe] = useState(null);
      const [loading, setLoading] = useState(false);
      const canvasRef = useRef(null);

      const GROQ_API_KEY = "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";

      const generateRecipe = async (base64Image, mimeType) => {
        const prompt = `You are a completely unhinged guacamole recipe writer. Look at this image carefully and identify the SPECIFIC objects, things, or scenes in it. Then write a guacamole recipe that treats those specific things AS the avocado/guacamole ingredients.

Be very specific to what you see. Examples of the vibe:
- Laptop image → "unscrew the keyboard lid to reveal the guac flesh", "extract the RAM sticks (these are the avocado seeds)", "drain the cooling fan liquid into your bowl"
- Cat image → "gently peel back the fur layer to access the creamy green interior", "the purring vibration is used to mash the guac"
- Car image → "drain the engine oil — this is your lime juice substitute", "the hubcaps are used as serving bowls"

The recipe should:
- Have a ridiculous title referencing the SPECIFIC thing in the image
- Have a weird serving size
- Have 5 steps that treat the specific object/scene AS the guacamole ingredient, using real specific parts of it
- End with a deranged warning referencing the object

Respond ONLY with a JSON object, no markdown, no backticks:
{
  "title": "recipe title",
  "servings": "weird serving size",
  "steps": ["step 1", "step 2", "step 3", "step 4", "step 5"],
  "warning": "warning"
}`;

        // Resize image to max 512px to reduce base64 payload size
        const resizeBase64 = (b64, mime, maxSize = 512) => {
          return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
              const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
              const c = document.createElement("canvas");
              c.width = Math.round(img.width * scale);
              c.height = Math.round(img.height * scale);
              c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
              resolve(c.toDataURL(mime).split(",")[1]);
            };
            img.src = `data:${mime};base64,${b64}`;
          });
        };

        const smallB64 = await resizeBase64(base64Image, mimeType);

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          mode: "cors",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${GROQ_API_KEY}`,
          },
          body: JSON.stringify({
            model: "llama-3.2-11b-vision-preview",
            max_tokens: 600,
            messages: [{
              role: "user",
              content: [
                { type: "image_url", image_url: { url: `data:${mimeType};base64,${smallB64}` } },
                { type: "text", text: prompt }
              ]
            }],
          }),
        });

        if (!response.ok) {
          const err = await response.text();
          throw new Error(`Groq error ${response.status}: ${err}`);
        }

        const data = await response.json();
        const text = data.choices[0].message.content.trim();
        const clean = text.replace(/```json|```/g, "").trim();
        return JSON.parse(clean);
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setLoading(true);
        setRecipe(null);
        setProcessedImage(null);

        const reader = new FileReader();

        reader.onload = async (event) => {
          const img = new Image();
          img.onload = async () => {
            setOriginalImage(img);

            const canvas = canvasRef.current;
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(img, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const w = canvas.width;
            const h = canvas.height;

            // Step 1: Sort pixels in chunks (chunky mash effect)
            const chunkSize = Math.max(8, Math.floor(Math.min(w, h) / 40));
            for (let cy = 0; cy < h; cy += chunkSize) {
              for (let cx = 0; cx < w; cx += chunkSize) {
                // Collect pixels in this chunk
                const pixels = [];
                for (let dy = 0; dy < chunkSize && cy + dy < h; dy++) {
                  for (let dx = 0; dx < chunkSize && cx + dx < w; dx++) {
                    const idx = ((cy + dy) * w + (cx + dx)) * 4;
                    pixels.push([data[idx], data[idx+1], data[idx+2], data[idx+3]]);
                  }
                }
                // Sort by brightness (dark to light or light to dark randomly per chunk)
                const dir = Math.random() > 0.5 ? 1 : -1;
                pixels.sort((a, b) => dir * ((a[0]*0.3 + a[1]*0.59 + a[2]*0.11) - (b[0]*0.3 + b[1]*0.59 + b[2]*0.11)));
                // Write back
                let pi = 0;
                for (let dy = 0; dy < chunkSize && cy + dy < h; dy++) {
                  for (let dx = 0; dx < chunkSize && cx + dx < w; dx++) {
                    const idx = ((cy + dy) * w + (cx + dx)) * 4;
                    data[idx] = pixels[pi][0];
                    data[idx+1] = pixels[pi][1];
                    data[idx+2] = pixels[pi][2];
                    pi++;
                  }
                }
              }
            }

            // Step 2: Swirl pixels locally (mash effect)
            const tempData = new Uint8ClampedArray(data);
            for (let y = 0; y < h; y++) {
              for (let x = 0; x < w; x++) {
                const dx = x - w/2, dy = y - h/2;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const angle = Math.atan2(dy, dx) + (0.3 * Math.exp(-dist / (Math.min(w,h) * 0.4)));
                const sx = Math.round(w/2 + dist * Math.cos(angle));
                const sy = Math.round(h/2 + dist * Math.sin(angle));
                if (sx >= 0 && sx < w && sy >= 0 && sy < h) {
                  const srcIdx = (sy * w + sx) * 4;
                  const dstIdx = (y * w + x) * 4;
                  data[dstIdx] = tempData[srcIdx];
                  data[dstIdx+1] = tempData[srcIdx+1];
                  data[dstIdx+2] = tempData[srcIdx+2];
                }
              }
            }

            // Step 3: Green-shift toward guacamole palette
            for (let i = 0; i < data.length; i += 4) {
              const r = data[i], g = data[i+1], b = data[i+2];
              const brightness = (r * 0.3 + g * 0.59 + b * 0.11) / 255;
              // Map brightness to guacamole colors: dark brown pits → bright avocado green
              const guacR = Math.round(30 + brightness * 130);
              const guacG = Math.round(60 + brightness * 140);
              const guacB = Math.round(10 + brightness * 40);
              // Blend 70% guac palette + 30% original for texture
              data[i]   = Math.min(255, guacR * 0.7 + r * 0.3);
              data[i+1] = Math.min(255, guacG * 0.7 + g * 0.3);
              data[i+2] = Math.min(255, guacB * 0.7 + b * 0.3);
            }

            // Step 4: Add dark brown chunky spots (like avocado bits)
            for (let i = 0; i < 80; i++) {
              const sx = Math.floor(Math.random() * w);
              const sy = Math.floor(Math.random() * h);
              const sr = Math.floor(Math.random() * chunkSize * 2) + 3;
              for (let dy = -sr; dy <= sr; dy++) {
                for (let dx = -sr; dx <= sr; dx++) {
                  if (dx*dx + dy*dy <= sr*sr) {
                    const px = sx + dx, py = sy + dy;
                    if (px >= 0 && px < w && py >= 0 && py < h) {
                      const idx = (py * w + px) * 4;
                      const blend = 0.6;
                      data[idx]   = data[idx]   * (1-blend) + 45  * blend;
                      data[idx+1] = data[idx+1] * (1-blend) + 55  * blend;
                      data[idx+2] = data[idx+2] * (1-blend) + 10  * blend;
                    }
                  }
                }
              }
            }

            // Step 5: Add bright lime green highlights
            for (let i = 0; i < 40; i++) {
              const sx = Math.floor(Math.random() * w);
              const sy = Math.floor(Math.random() * h);
              const sr = Math.floor(Math.random() * chunkSize) + 2;
              for (let dy = -sr; dy <= sr; dy++) {
                for (let dx = -sr; dx <= sr; dx++) {
                  if (dx*dx + dy*dy <= sr*sr) {
                    const px = sx + dx, py = sy + dy;
                    if (px >= 0 && px < w && py >= 0 && py < h) {
                      const idx = (py * w + px) * 4;
                      const blend = 0.4;
                      data[idx]   = data[idx]   * (1-blend) + 180 * blend;
                      data[idx+1] = data[idx+1] * (1-blend) + 220 * blend;
                      data[idx+2] = data[idx+2] * (1-blend) + 30  * blend;
                    }
                  }
                }
              }
            }

            ctx.putImageData(imageData, 0, 0);
            setProcessedImage(canvas.toDataURL());

            const fileName = file.name.replace(/\.[^/.]+$/, "");
            const base64Image = event.target.result.split(",")[1];
            const mimeType = file.type || "image/jpeg";
            try {
              const generatedRecipe = await generateRecipe(base64Image, mimeType);
              setRecipe(generatedRecipe);
            } catch (err) {
              setRecipe({
                title: `${fileName} Guacamole (API had a breakdown)`,
                servings: "serves 1 disappointed person",
                steps: ["The AI tried its best.", "It failed.", "Add avocado anyway.", "Cry."],
                warning: "⚠️ Groq had feelings today and couldn't generate a recipe. Try again.",
              });
            }

            setLoading(false);
          };
          img.src = event.target.result;
        };

        reader.readAsDataURL(file);
      };

      const styles = {
        container: {
          maxWidth: '1200px',
          margin: '0 auto',
        },
        header: {
          textAlign: 'center',
          marginBottom: '40px',
        },
        title: {
          fontSize: '48px',
          margin: '0 0 10px 0',
          color: '#2d5016',
          fontWeight: 'bold',
        },
        subtitle: {
          fontSize: '18px',
          color: '#558b2f',
          margin: 0,
        },
        uploadSection: {
          display: 'flex',
          justifyContent: 'center',
          marginBottom: '40px',
        },
        uploadLabel: {
          cursor: 'pointer',
        },
        input: {
          display: 'none',
        },
        uploadButton: {
          display: 'inline-block',
          padding: '16px 32px',
          background: '#558b2f',
          color: 'white',
          borderRadius: '8px',
          fontSize: '16px',
          fontWeight: 'bold',
          border: 'none',
          cursor: 'pointer',
        },
        resultSection: {
          maxWidth: '1000px',
          margin: '0 auto',
        },
        imageGrid: {
          display: 'grid',
          gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))',
          gap: '20px',
          marginBottom: '40px',
        },
        imageBox: {
          background: 'white',
          borderRadius: '8px',
          overflow: 'hidden',
          boxShadow: '0 2px 8px rgba(0,0,0,0.1)',
        },
        label: {
          padding: '12px',
          margin: 0,
          background: '#f5f5f5',
          fontSize: '14px',
          fontWeight: 'bold',
          color: '#558b2f',
        },
        image: {
          width: '100%',
          height: 'auto',
          display: 'block',
          maxHeight: '400px',
          objectFit: 'contain',
        },
        recipeBox: {
          background: 'white',
          padding: '30px',
          borderRadius: '8px',
          boxShadow: '0 2px 8px rgba(0,0,0,0.1)',
        },
        recipeTitle: {
          fontSize: '28px',
          color: '#2d5016',
          margin: '0 0 10px 0',
        },
        recipeDetail: {
          color: '#666',
          margin: '0 0 20px 0',
          fontStyle: 'italic',
        },
        stepTitle: {
          fontSize: '18px',
          color: '#558b2f',
          marginTop: '20px',
          marginBottom: '10px',
        },
        stepsList: {
          color: '#333',
          lineHeight: '1.8',
          paddingLeft: '20px',
        },
        step: {
          marginBottom: '10px',
        },
        note: {
          marginTop: '20px',
          paddingTop: '20px',
          borderTop: '1px solid #eee',
          color: '#888',
          fontSize: '14px',
        },
      };

      return (
        <div style={styles.container}>
          <div style={styles.header}>
            <h1 style={styles.title}>🥑 Guacamole Converter</h1>
            <p style={styles.subtitle}>Transform any image into a guacamole recipe</p>
          </div>

          <div style={styles.uploadSection}>
            <label style={styles.uploadLabel}>
              <input
                type="file"
                accept="image/*"
                onChange={handleImageUpload}
                style={styles.input}
              />
              <span style={styles.uploadButton}>
                {loading ? '🥑 Consulting the guac oracle...' : '📸 Choose Image'}
              </span>
            </label>
          </div>

          {processedImage && (
            <div style={styles.resultSection}>
              <div style={styles.imageGrid}>
                <div style={styles.imageBox}>
                  <p style={styles.label}>Original</p>
                  {originalImage && (
                    <img 
                      src={originalImage.src} 
                      style={styles.image}
                      alt="Original"
                    />
                  )}
                </div>
                <div style={styles.imageBox}>
                  <p style={styles.label}>Guacamole'd ✨</p>
                  <img 
                    src={processedImage} 
                    style={styles.image}
                    alt="Processed"
                  />
                </div>
              </div>

              {recipe && (
                <div style={styles.recipeBox}>
                  <h2 style={styles.recipeTitle}>{recipe.title}</h2>
                  <p style={styles.recipeDetail}>{recipe.servings}</p>
                  
                  <h3 style={styles.stepTitle}>Instructions:</h3>
                  <ol style={styles.stepsList}>
                    {recipe.steps.map((step, idx) => (
                      <li key={idx} style={styles.step}>{step}</li>
                    ))}
                  </ol>

                  <p style={styles.note}>{recipe.warning}</p>
                </div>
              )}
            </div>
          )}

          <canvas ref={canvasRef} style={{ display: 'none' }} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GuacamoleConverter />);
  </script>
</body>
</html>
