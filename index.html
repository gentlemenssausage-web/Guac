<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥑 Guacamole Converter</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0f4e8 0%, #e0edd0 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef } = React;

    const GROQ_RECIPE_KEY = "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";
    const GROQ_VISION_KEY = "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";

    // Real guac photo from Wikimedia Commons (public domain)
    const GUAC_IMG_URL = "https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Guacamole_y_totopos.jpg/640px-Guacamole_y_totopos.jpg";

    async function groqPost(apiKey, body) {
      const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST", mode: "cors",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error("Groq " + r.status + ": " + await r.text());
      return r.json();
    }

    async function describeImage(base64, mime) {
      const data = await groqPost(GROQ_VISION_KEY, {
        model: "qwen/qwen3.6-27b",
        max_tokens: 200,
        messages: [{
          role: "user",
          content: [
            { type: "image_url", image_url: { url: "data:" + mime + ";base64," + base64 } },
            { type: "text", text: "Describe in 2 sentences: what specific objects, colors, and textures are in this image? Be precise." }
          ]
        }]
      });
      return data.choices[0].message.content.trim();
    }

    async function generateRecipe(imageName, imageDescription) {
      const prompt = `You are a completely unhinged guacamole recipe writer.

The image contains: ${imageDescription}

Write a guacamole recipe that treats the SPECIFIC things in this image as guacamole ingredients. Reference real parts of what you see.

Examples:
- Dell laptop in a box -> "peel back the white plastic Dell lid to reveal the guac flesh inside the chassis"
- Cat -> "separate the fur layers to access the purring green interior"
- Windows settings screen -> "drain the RAM coolant (your lime juice), mash the CPU cores together"

Be absurd, specific, funny. You MUST respond with ONLY a raw JSON object. Start with { end with }.
{
  "title": "ridiculous title referencing what's actually in the image",
  "servings": "weird serving size",
  "steps": ["step referencing specific parts of image", "step 2", "step 3", "step 4", "step 5"],
  "warning": "⚠️ unhinged warning referencing the image"
}`;

      const data = await groqPost(GROQ_RECIPE_KEY, {
        model: "llama-3.3-70b-versatile",
        max_tokens: 700,
        messages: [{ role: "user", content: prompt }]
      });
      const text = data.choices[0].message.content.trim();
      const match = text.match(/\{[\s\S]*\}/);
      if (!match) throw new Error("No JSON: " + text.slice(0, 100));
      return JSON.parse(match[0]);
    }

    // Load guac reference image into a canvas, return pixel data
    async function loadGuacTexture() {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          const SIZE = 512;
          const c = document.createElement("canvas");
          c.width = SIZE; c.height = SIZE;
          const ctx = c.getContext("2d");
          ctx.drawImage(img, 0, 0, SIZE, SIZE);
          resolve({ ctx, data: ctx.getImageData(0, 0, SIZE, SIZE).data, size: SIZE });
        };
        img.onerror = reject;
        img.src = GUAC_IMG_URL;
      });
    }

    // Get average RGB of a region in a pixel data array
    function avgColor(data, x, y, cellW, cellH, imgW) {
      let r=0, g=0, b=0, n=0;
      for (let dy = 0; dy < cellH; dy++) {
        for (let dx = 0; dx < cellW; dx++) {
          const i = ((y+dy)*imgW+(x+dx))*4;
          r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++;
        }
      }
      return [r/n, g/n, b/n];
    }

    // Color distance squared
    function colorDist(a, b) {
      return (a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2;
    }

    // The main effect: divide source into grid cells, replace each cell
    // with the best-matching guac texture cell, then blend+posterize
    async function applyGuacEffect(ctx, w, h, setStatus) {
      setStatus("Loading guac texture...");
      const guac = await loadGuacTexture();

      setStatus("Analyzing cells...");
      const srcData = ctx.getImageData(0, 0, w, h).data;

      const GRID = 48; // NxN grid of cells
      const cellW = Math.floor(w / GRID);
      const cellH = Math.floor(h / GRID);
      const guacCellW = Math.floor(guac.size / GRID);
      const guacCellH = Math.floor(guac.size / GRID);

      // Precompute avg color of every guac cell
      const guacCells = [];
      for (let gy = 0; gy < GRID; gy++) {
        for (let gx = 0; gx < GRID; gx++) {
          guacCells.push({
            gx, gy,
            avg: avgColor(guac.data, gx*guacCellW, gy*guacCellH, guacCellW, guacCellH, guac.size)
          });
        }
      }

      setStatus("Guacamolifying...");

      // For each source cell, find the best-matching guac cell and copy its pixels
      const outCanvas = document.createElement("canvas");
      outCanvas.width = w; outCanvas.height = h;
      const outCtx = outCanvas.getContext("2d");

      // Draw original first as base
      outCtx.drawImage(ctx.canvas, 0, 0);

      for (let sy = 0; sy < GRID; sy++) {
        for (let sx = 0; sx < GRID; sx++) {
          const srcAvg = avgColor(srcData, sx*cellW, sy*cellH, cellW, cellH, w);

          // Find closest guac cell by color distance
          let best = guacCells[0], bestDist = Infinity;
          for (const gc of guacCells) {
            const d = colorDist(srcAvg, gc.avg);
            if (d < bestDist) { bestDist = d; best = gc; }
          }

          // Copy that guac cell's pixels into output at source position
          const guacPatch = guac.ctx.getImageData(
            best.gx * guacCellW, best.gy * guacCellH, guacCellW, guacCellH
          );

          // Scale guac patch to cell size and draw
          const patchCanvas = document.createElement("canvas");
          patchCanvas.width = guacCellW; patchCanvas.height = guacCellH;
          patchCanvas.getContext("2d").putImageData(guacPatch, 0, 0);
          outCtx.drawImage(patchCanvas, sx*cellW, sy*cellH, cellW, cellH);
        }
      }

      // Step 2: Blend with original for structure preservation (like obamafy's proximity importance)
      // Draw original at low opacity over the guac mosaic so faces/shapes stay readable
      outCtx.globalAlpha = 0.25;
      outCtx.globalCompositeOperation = "luminosity";
      outCtx.drawImage(ctx.canvas, 0, 0);
      outCtx.globalAlpha = 1.0;
      outCtx.globalCompositeOperation = "source-over";

      // Step 3: Posterize to 4 guac colors for the iconic poster look
      const final = outCtx.getImageData(0, 0, w, h);
      const fd = final.data;
      const PALETTE = [
        [22,  38,  5 ],
        [68,  90,  12],
        [130, 165, 28],
        [200, 230, 65],
      ];
      for (let i = 0; i < fd.length; i += 4) {
        // Boost contrast first
        let lum = fd[i]*0.299 + fd[i+1]*0.587 + fd[i+2]*0.114;
        // Floyd-Steinberg dithering: add quantization error to neighbors
        const band = lum < 55 ? 0 : lum < 115 ? 1 : lum < 185 ? 2 : 3;
        const err = lum - (band === 0 ? 30 : band === 1 ? 85 : band === 2 ? 150 : 215);
        // Spread error (simplified, horizontal only for speed)
        if (i+4 < fd.length) {
          fd[i+4] = Math.max(0, Math.min(255, fd[i+4] + err * 7/16));
        }
        fd[i]   = PALETTE[band][0];
        fd[i+1] = PALETTE[band][1];
        fd[i+2] = PALETTE[band][2];
      }
      outCtx.putImageData(final, 0, 0);

      // Copy result back to original canvas
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(outCanvas, 0, 0);
    }

    function App() {
      const [originalSrc, setOriginalSrc] = useState(null);
      const [processedSrc, setProcessedSrc] = useState(null);
      const [recipe, setRecipe] = useState(null);
      const [loading, setLoading] = useState(false);
      const [status, setStatus] = useState("");
      const canvasRef = useRef(null);

      async function handleUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        setLoading(true);
        setRecipe(null);
        setProcessedSrc(null);
        setStatus("Reading image...");

        const reader = new FileReader();
        reader.onload = async (ev) => {
          const src = ev.target.result;
          setOriginalSrc(src);
          const base64 = src.split(",")[1];
          const mime = file.type || "image/jpeg";

          const img = new Image();
          img.onload = async () => {
            const canvas = canvasRef.current;
            // Cap size for performance
            const MAX = 600;
            const scale = Math.min(1, MAX / Math.max(img.width, img.height));
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // Describe image
            setStatus("Analyzing image...");
            let desc = "an unidentified object";
            try { desc = await describeImage(base64, mime); } catch(e) { console.warn("Vision:", e.message); }

            // Apply effect
            try {
              await applyGuacEffect(ctx, canvas.width, canvas.height, setStatus);
            } catch(e) {
              console.error("Effect failed:", e);
            }
            setProcessedSrc(canvas.toDataURL());

            // Generate recipe
            setStatus("Generating recipe...");
            try {
              const r = await generateRecipe(file.name, desc);
              setRecipe(r);
            } catch(e) {
              console.error(e);
              setRecipe({
                title: "Guacamole (something broke)",
                servings: "serves 0",
                steps: ["Error: " + e.message],
                warning: "⚠️ The guac oracle is temporarily unhinged."
              });
            }
            setLoading(false);
            setStatus("");
          };
          img.src = src;
        };
        reader.readAsDataURL(file);
      }

      const s = {
        wrap: { maxWidth: 1100, margin: "0 auto" },
        h1: { fontSize: 52, color: "#2d5016", textAlign: "center", marginBottom: 8, fontWeight: 900 },
        sub: { fontSize: 18, color: "#558b2f", textAlign: "center", marginBottom: 40 },
        btnWrap: { display: "flex", justifyContent: "center", marginBottom: 40 },
        btn: { padding: "18px 40px", background: "#558b2f", color: "white", borderRadius: 10, fontSize: 18, fontWeight: "bold", cursor: "pointer", border: "none", boxShadow: "0 4px 12px rgba(85,139,47,0.4)" },
        grid: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, marginBottom: 30 },
        box: { background: "white", borderRadius: 12, overflow: "hidden", boxShadow: "0 4px 16px rgba(0,0,0,.12)" },
        boxLabel: { padding: "12px 16px", background: "#f5f5f5", fontWeight: "bold", color: "#558b2f", fontSize: 14, letterSpacing: 1 },
        img: { width: "100%", maxHeight: 450, objectFit: "contain", display: "block" },
        recipeBox: { background: "white", padding: 36, borderRadius: 12, boxShadow: "0 4px 16px rgba(0,0,0,.12)" },
        title: { fontSize: 28, color: "#2d5016", marginBottom: 8, fontWeight: 800, lineHeight: 1.3 },
        serving: { color: "#666", fontStyle: "italic", marginBottom: 20, fontSize: 15 },
        stepsLabel: { fontSize: 16, color: "#558b2f", fontWeight: "bold", marginBottom: 10, textTransform: "uppercase", letterSpacing: 1 },
        ol: { paddingLeft: 22, color: "#333", lineHeight: 2 },
        li: { marginBottom: 10 },
        warn: { marginTop: 24, paddingTop: 18, borderTop: "1px solid #eee", color: "#888", fontSize: 14 },
        status: { textAlign: "center", color: "#558b2f", fontStyle: "italic", marginBottom: 20, fontSize: 16 }
      };

      return (
        <div style={s.wrap}>
          <h1 style={s.h1}>🥑 Guacamole Converter</h1>
          <p style={s.sub}>Transform any image into a guacamole recipe</p>
          <div style={s.btnWrap}>
            <label>
              <input type="file" accept="image/*" onChange={handleUpload} style={{display:"none"}} />
              <span style={s.btn}>{loading ? "🥑 " + status : "📸 Choose Image"}</span>
            </label>
          </div>

          {(originalSrc || processedSrc) && (
            <div style={s.grid}>
              <div style={s.box}>
                <div style={s.boxLabel}>ORIGINAL</div>
                {originalSrc && <img src={originalSrc} style={s.img} alt="original" />}
              </div>
              <div style={s.box}>
                <div style={s.boxLabel}>GUACAMOLE'D ✨</div>
                {processedSrc && <img src={processedSrc} style={s.img} alt="processed" />}
              </div>
            </div>
          )}

          {recipe && (
            <div style={s.recipeBox}>
              <div style={s.title}>{recipe.title}</div>
              <div style={s.serving}>{recipe.servings}</div>
              <div style={s.stepsLabel}>Instructions</div>
              <ol style={s.ol}>
                {recipe.steps.map((step, i) => <li key={i} style={s.li}>{step}</li>)}
              </ol>
              <div style={s.warn}>{recipe.warning}</div>
            </div>
          )}

          <canvas ref={canvasRef} style={{display:"none"}} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
