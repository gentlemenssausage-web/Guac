<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥑 Guacamole Converter</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8f5e9 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    function GuacamoleConverter() {
      const [originalImage, setOriginalImage] = useState(null);
      const [processedImage, setProcessedImage] = useState(null);
      const [recipe, setRecipe] = useState(null);
      const [loading, setLoading] = useState(false);
      const canvasRef = useRef(null);

      const GROQ_RECIPE_KEY = "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";
      const GROQ_VISION_KEY = "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";

      const groqPost = async (apiKey, body) => {
        const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST", mode: "cors",
          headers: { "Content-Type": "application/json", "Authorization": \`Bearer \${apiKey}\` },
          body: JSON.stringify(body),
        });
        if (!r.ok) throw new Error(\`Groq \${r.status}: \${await r.text()}\`);
        return r.json();
      };

      const generateRecipe = async (imageName) => {
        const prompt = `You are a completely unhinged guacamole recipe writer. The image is called "${imageName}". Based on that name, imagine the SPECIFIC objects in it and write a guacamole recipe that treats those things AS the avocado/guacamole ingredients. Then write a guacamole recipe that treats those specific things AS the avocado/guacamole ingredients.

Be very specific to what you see. Examples of the vibe:
- filename 'laptop' → "unscrew the keyboard lid to reveal the guac flesh", "extract the RAM sticks (these are the avocado seeds)"
- filename 'cat' → "gently peel back the fur layer to access the creamy green interior"
- filename 'car' → "drain the engine oil — this is your lime juice substitute"

The recipe should:
- Have a ridiculous title referencing the SPECIFIC thing in the image
- Have a weird serving size
- Have 5 steps that treat the specific object/scene AS the guacamole ingredient, using real specific parts of it
- End with a deranged warning referencing the object

You MUST respond with ONLY a raw JSON object. No markdown. No backticks. No explanation. No text before or after. Start your response with { and end with }.
{
  "title": "recipe title",
  "servings": "weird serving size",
  "steps": ["step 1", "step 2", "step 3", "step 4", "step 5"],
  "warning": "warning"
}`;

        const data = await groqPost(GROQ_RECIPE_KEY, {
          model: "llama-3.3-70b-versatile",
          max_tokens: 600,
          messages: [{ role: "user", content: prompt }],
        });
        const text = data.choices[0].message.content.trim();
        // Extract JSON even if model wraps it in markdown or adds extra text
        const jsonMatch = text.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error("No JSON found in response: " + text.slice(0, 200));
        return JSON.parse(jsonMatch[0]);
      };

      const describeImageForGuac = async (base64Image, mimeType) => {
        const data = await groqPost(GROQ_VISION_KEY, {
          model: "qwen/qwen3.6-27b",
          max_tokens: 300,
          messages: [{
            role: "user",
            content: [
              { type: "image_url", image_url: { url: \`data:\${mimeType};base64,\${base64Image}\` } },
              { type: "text", text: "Describe in 1-2 sentences ONLY the dominant colors, textures, and shapes you see. Be specific. No commentary." }
            ]
          }]
        });
        return data.choices[0].message.content.trim();
      };

      const applyGuacamoleEffect = (ctx, w, h, visualDescription) => {
        const imageData = ctx.getImageData(0, 0, w, h);
        const data = imageData.data;

        // Step 1: Pixelate into chunks and sort pixels by luminance (mashed texture)
        const chunkSize = Math.max(6, Math.floor(Math.min(w, h) / 50));
        for (let cy = 0; cy < h; cy += chunkSize) {
          for (let cx = 0; cx < w; cx += chunkSize) {
            const pixels = [];
            for (let dy = 0; dy < chunkSize && cy+dy < h; dy++)
              for (let dx = 0; dx < chunkSize && cx+dx < w; dx++) {
                const i = ((cy+dy)*w+(cx+dx))*4;
                pixels.push([data[i],data[i+1],data[i+2]]);
              }
            // Sort by luminance - makes it look chunky/mashed
            pixels.sort((a,b) => (a[0]*0.3+a[1]*0.59+a[2]*0.11)-(b[0]*0.3+b[1]*0.59+b[2]*0.11));
            let pi = 0;
            for (let dy = 0; dy < chunkSize && cy+dy < h; dy++)
              for (let dx = 0; dx < chunkSize && cx+dx < w; dx++) {
                const i = ((cy+dy)*w+(cx+dx))*4;
                data[i]=pixels[pi][0]; data[i+1]=pixels[pi][1]; data[i+2]=pixels[pi][2]; pi++;
              }
          }
        }

        // Step 2: Swap random pixel blocks around (scramble like mashing)
        for (let s = 0; s < 3000; s++) {
          const ax = Math.floor(Math.random()*w), ay = Math.floor(Math.random()*h);
          const bx = Math.floor(Math.random()*w), by = Math.floor(Math.random()*h);
          const ai = (ay*w+ax)*4, bi = (by*w+bx)*4;
          for (let c = 0; c < 3; c++) { const t=data[ai+c]; data[ai+c]=data[bi+c]; data[bi+c]=t; }
        }

        // Step 3: Map every pixel to guacamole palette based on its brightness
        for (let i = 0; i < data.length; i += 4) {
          const lum = (data[i]*0.3 + data[i+1]*0.59 + data[i+2]*0.11) / 255;
          // Guac palette: dark=deep olive brown, mid=avocado green, bright=lime green
          const r = lum < 0.3 ? 40+lum*80 : lum < 0.7 ? 80+lum*100 : 160+lum*40;
          const g = lum < 0.3 ? 50+lum*100 : lum < 0.7 ? 100+lum*120 : 180+lum*50;
          const b = lum < 0.3 ? 5+lum*20  : lum < 0.7 ? 10+lum*30  : 20+lum*20;
          data[i]   = Math.min(255, r);
          data[i+1] = Math.min(255, g);
          data[i+2] = Math.min(255, b);
        }

        // Step 4: Paint dark brown avocado pit blobs
        for (let s = 0; s < 60; s++) {
          const sx=Math.floor(Math.random()*w), sy=Math.floor(Math.random()*h);
          const sr=Math.floor(Math.random()*chunkSize*3)+4;
          for (let dy=-sr; dy<=sr; dy++) for (let dx=-sr; dx<=sr; dx++) {
            if (dx*dx+dy*dy>sr*sr) continue;
            const px=sx+dx, py=sy+dy;
            if (px<0||px>=w||py<0||py>=h) continue;
            const i=(py*w+px)*4, b=0.55;
            data[i]=data[i]*(1-b)+35*b; data[i+1]=data[i+1]*(1-b)+45*b; data[i+2]=data[i+2]*(1-b)+8*b;
          }
        }

        // Step 5: Bright lime green highlights
        for (let s = 0; s < 35; s++) {
          const sx=Math.floor(Math.random()*w), sy=Math.floor(Math.random()*h);
          const sr=Math.floor(Math.random()*chunkSize*2)+2;
          for (let dy=-sr; dy<=sr; dy++) for (let dx=-sr; dx<=sr; dx++) {
            if (dx*dx+dy*dy>sr*sr) continue;
            const px=sx+dx, py=sy+dy;
            if (px<0||px>=w||py<0||py>=h) continue;
            const i=(py*w+px)*4, b=0.4;
            data[i]=data[i]*(1-b)+190*b; data[i+1]=data[i+1]*(1-b)+230*b; data[i+2]=data[i+2]*(1-b)+25*b;
          }
        }

        ctx.putImageData(imageData, 0, 0);
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setLoading(true);
        setRecipe(null);
        setProcessedImage(null);

        const reader = new FileReader();

        reader.onload = async (event) => {
          const img = new Image();
          img.onload = async () => {
            setOriginalImage(img);

            const canvas = canvasRef.current;
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(img, 0, 0);

            // Vision call to describe image, then apply guac effect
            const base64ForVision = event.target.result.split(',')[1];
            const mimeForVision = file.type || 'image/jpeg';
            let visualDesc = '';
            try { visualDesc = await describeImageForGuac(base64ForVision, mimeForVision); } catch(e) { console.warn('Vision failed:', e); }
            applyGuacamoleEffect(ctx, canvas.width, canvas.height, visualDesc);
            setProcessedImage(canvas.toDataURL());

            const fileName = file.name.replace(/\.[^/.]+$/, "");
            try {
              const generatedRecipe = await generateRecipe(fileName);
              setRecipe(generatedRecipe);
            } catch (err) {
              console.error("Recipe generation failed:", err);
              setRecipe({
                title: `${fileName} Guacamole (API Error)`,
                servings: "serves 1 disappointed person",
                steps: ["The AI encountered an error.", "Mash ingredients manually.", "Add avocado anyway.", "Serve with chips."],
                warning: "⚠️ Error: " + err.message,
              });
            }

            setLoading(false);
          };
          img.src = event.target.result;
        };

        reader.readAsDataURL(file);
      };

      const styles = {
        container: {
          maxWidth: '1200px',
          margin: '0 auto',
        },
        header: {
          textAlign: 'center',
          marginBottom: '40px',
        },
        title: {
          fontSize: '48px',
          margin: '0 0 10px 0',
          color: '#2d5016',
          fontWeight: 'bold',
        },
        subtitle: {
          fontSize: '18px',
          color: '#558b2f',
          margin: 0,
        },
        uploadSection: {
          display: 'flex',
          justifyContent: 'center',
          marginBottom: '40px',
        },
        uploadLabel: {
          cursor: 'pointer',
        },
        input: {
          display: 'none',
        },
        uploadButton: {
          display: 'inline-block',
          padding: '16px 32px',
          background: '#558b2f',
          color: 'white',
          borderRadius: '8px',
          fontSize: '16px',
          fontWeight: 'bold',
          border: 'none',
          cursor: 'pointer',
        },
        resultSection: {
          maxWidth: '1000px',
          margin: '0 auto',
        },
        imageGrid: {
          display: 'grid',
          gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))',
          gap: '20px',
          marginBottom: '40px',
        },
        imageBox: {
          background: 'white',
          borderRadius: '8px',
          overflow: 'hidden',
          boxShadow: '0 2px 8px rgba(0,0,0,0.1)',
        },
        label: {
          padding: '12px',
          margin: 0,
          background: '#f5f5f5',
          fontSize: '14px',
          fontWeight: 'bold',
          color: '#558b2f',
        },
        image: {
          width: '100%',
          height: 'auto',
          display: 'block',
          maxHeight: '400px',
          objectFit: 'contain',
        },
        recipeBox: {
          background: 'white',
          padding: '30px',
          borderRadius: '8px',
          boxShadow: '0 2px 8px rgba(0,0,0,0.1)',
        },
        recipeTitle: {
          fontSize: '28px',
          color: '#2d5016',
          margin: '0 0 10px 0',
        },
        recipeDetail: {
          color: '#666',
          margin: '0 0 20px 0',
          fontStyle: 'italic',
        },
        stepTitle: {
          fontSize: '18px',
          color: '#558b2f',
          marginTop: '20px',
          marginBottom: '10px',
        },
        stepsList: {
          color: '#333',
          lineHeight: '1.8',
          paddingLeft: '20px',
        },
        step: {
          marginBottom: '10px',
        },
        note: {
          marginTop: '20px',
          paddingTop: '20px',
          borderTop: '1px solid #eee',
          color: '#888',
          fontSize: '14px',
        },
      };

      return (
        <div style={styles.container}>
          <div style={styles.header}>
            <h1 style={styles.title}>🥑 Guacamole Converter</h1>
            <p style={styles.subtitle}>Transform any image into a guacamole recipe</p>
          </div>

          <div style={styles.uploadSection}>
            <label style={styles.uploadLabel}>
              <input
                type="file"
                accept="image/*"
                onChange={handleImageUpload}
                style={styles.input}
              />
              <span style={styles.uploadButton}>
                {loading ? '🥑 Consulting the guac oracle...' : '📸 Choose Image'}
              </span>
            </label>
          </div>

          {processedImage && (
            <div style={styles.resultSection}>
              <div style={styles.imageGrid}>
                <div style={styles.imageBox}>
                  <p style={styles.label}>Original</p>
                  {originalImage && (
                    <img 
                      src={originalImage.src} 
                      style={styles.image}
                      alt="Original"
                    />
                  )}
                </div>
                <div style={styles.imageBox}>
                  <p style={styles.label}>Guacamole'd ✨</p>
                  <img 
                    src={processedImage} 
                    style={styles.image}
                    alt="Processed"
                  />
                </div>
              </div>

              {recipe && (
                <div style={styles.recipeBox}>
                  <h2 style={styles.recipeTitle}>{recipe.title}</h2>
                  <p style={styles.recipeDetail}>{recipe.servings}</p>
                  
                  <h3 style={styles.stepTitle}>Instructions:</h3>
                  <ol style={styles.stepsList}>
                    {recipe.steps.map((step, idx) => (
                      <li key={idx} style={styles.step}>{step}</li>
                    ))}
                  </ol>

                  <p style={styles.note}>{recipe.warning}</p>
                </div>
              )}
            </div>
          )}

          <canvas ref={canvasRef} style={{ display: 'none' }} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GuacamoleConverter />);
  </script>
</body>
</html>
