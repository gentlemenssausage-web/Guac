<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥑 Guacamole Converter</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8f5e9 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef } = React;

    const GROQ_RECIPE_KEY = "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";
    const GROQ_VISION_KEY = "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";

    async function groqPost(apiKey, body) {
      const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey
        },
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error("Groq " + r.status + ": " + await r.text());
      return r.json();
    }

    async function describeImage(base64, mime) {
      const data = await groqPost(GROQ_VISION_KEY, {
        model: "qwen/qwen3.6-27b",
        max_tokens: 200,
        messages: [{
          role: "user",
          content: [
            { type: "image_url", image_url: { url: "data:" + mime + ";base64," + base64 } },
            { type: "text", text: "Describe in 2 sentences: what specific objects, colors, and textures are in this image? Be precise." }
          ]
        }]
      });
      return data.choices[0].message.content.trim();
    }

    async function generateRecipe(imageName, imageDescription) {
      const prompt = `You are a completely unhinged guacamole recipe writer. 

The image is called "${imageName}" and contains: ${imageDescription}

Write a guacamole recipe that treats the SPECIFIC things in this image as guacamole ingredients. Reference real parts of what you see.

Examples of the vibe:
- Dell laptop in a box -> "peel back the white plastic lid of the Dell to reveal the creamy green motherboard flesh inside"
- Cat -> "gently separate the fur layers to access the purring green interior"
- Car -> "drain the coolant (this is your lime juice), extract the spark plugs (avocado seeds)"

Be absurd, specific, and funny. 

You MUST respond with ONLY a raw JSON object. Nothing before or after. Start with { end with }.
{
  "title": "ridiculous title referencing what's in the image",
  "servings": "weird serving size description",
  "steps": ["step 1 referencing specific parts of the image", "step 2", "step 3", "step 4", "step 5"],
  "warning": "⚠️ unhinged warning referencing the image"
}`;

      const data = await groqPost(GROQ_RECIPE_KEY, {
        model: "llama-3.3-70b-versatile",
        max_tokens: 700,
        messages: [{ role: "user", content: prompt }]
      });

      const text = data.choices[0].message.content.trim();
      const match = text.match(/\{[\s\S]*\}/);
      if (!match) throw new Error("No JSON in: " + text.slice(0, 100));
      return JSON.parse(match[0]);
    }

    function applyGuacEffect(ctx, w, h) {
      const imageData = ctx.getImageData(0, 0, w, h);
      const data = imageData.data;
      const chunk = Math.max(6, Math.floor(Math.min(w, h) / 50));

      // Sort pixels by luminance in chunks (mashed texture)
      for (let cy = 0; cy < h; cy += chunk) {
        for (let cx = 0; cx < w; cx += chunk) {
          const pixels = [];
          for (let dy = 0; dy < chunk && cy+dy < h; dy++)
            for (let dx = 0; dx < chunk && cx+dx < w; dx++) {
              const i = ((cy+dy)*w+(cx+dx))*4;
              pixels.push([data[i], data[i+1], data[i+2]]);
            }
          pixels.sort((a,b) => (a[0]*.3+a[1]*.59+a[2]*.11) - (b[0]*.3+b[1]*.59+b[2]*.11));
          let pi = 0;
          for (let dy = 0; dy < chunk && cy+dy < h; dy++)
            for (let dx = 0; dx < chunk && cx+dx < w; dx++) {
              const i = ((cy+dy)*w+(cx+dx))*4;
              data[i]=pixels[pi][0]; data[i+1]=pixels[pi][1]; data[i+2]=pixels[pi][2]; pi++;
            }
        }
      }

      // Randomly swap pixels (mashing effect)
      for (let s = 0; s < 4000; s++) {
        const ax=Math.floor(Math.random()*w), ay=Math.floor(Math.random()*h);
        const bx=Math.floor(Math.random()*w), by=Math.floor(Math.random()*h);
        const ai=(ay*w+ax)*4, bi=(by*w+bx)*4;
        for (let c=0; c<3; c++) { const t=data[ai+c]; data[ai+c]=data[bi+c]; data[bi+c]=t; }
      }

      // Remap to guacamole color palette
      for (let i = 0; i < data.length; i += 4) {
        const lum = (data[i]*.3 + data[i+1]*.59 + data[i+2]*.11) / 255;
        data[i]   = Math.min(255, lum < .4 ? 30+lum*120 : 80+lum*130);
        data[i+1] = Math.min(255, lum < .4 ? 55+lum*140 : 110+lum*140);
        data[i+2] = Math.min(255, lum < .4 ? 5+lum*25   : 10+lum*35);
      }

      // Dark brown blobs (avocado chunks)
      for (let s = 0; s < 70; s++) {
        const sx=Math.floor(Math.random()*w), sy=Math.floor(Math.random()*h), sr=Math.floor(Math.random()*chunk*3)+4;
        for (let dy=-sr; dy<=sr; dy++) for (let dx=-sr; dx<=sr; dx++) {
          if (dx*dx+dy*dy>sr*sr) continue;
          const px=sx+dx, py=sy+dy;
          if (px<0||px>=w||py<0||py>=h) continue;
          const i=(py*w+px)*4, b=.55;
          data[i]=data[i]*(1-b)+35*b; data[i+1]=data[i+1]*(1-b)+48*b; data[i+2]=data[i+2]*(1-b)+8*b;
        }
      }

      // Lime green highlights
      for (let s = 0; s < 40; s++) {
        const sx=Math.floor(Math.random()*w), sy=Math.floor(Math.random()*h), sr=Math.floor(Math.random()*chunk*2)+2;
        for (let dy=-sr; dy<=sr; dy++) for (let dx=-sr; dx<=sr; dx++) {
          if (dx*dx+dy*dy>sr*sr) continue;
          const px=sx+dx, py=sy+dy;
          if (px<0||px>=w||py<0||py>=h) continue;
          const i=(py*w+px)*4, b=.4;
          data[i]=data[i]*(1-b)+185*b; data[i+1]=data[i+1]*(1-b)+225*b; data[i+2]=data[i+2]*(1-b)+25*b;
        }
      }

      ctx.putImageData(imageData, 0, 0);
    }

    function App() {
      const [originalSrc, setOriginalSrc] = useState(null);
      const [processedSrc, setProcessedSrc] = useState(null);
      const [recipe, setRecipe] = useState(null);
      const [loading, setLoading] = useState(false);
      const [status, setStatus] = useState("");
      const canvasRef = useRef(null);

      async function handleUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        setLoading(true);
        setRecipe(null);
        setProcessedSrc(null);
        setStatus("Reading image...");

        const reader = new FileReader();
        reader.onload = async (ev) => {
          const src = ev.target.result;
          setOriginalSrc(src);
          const base64 = src.split(",")[1];
          const mime = file.type || "image/jpeg";
          const fileName = file.name.replace(/\.[^/.]+$/, "");

          const img = new Image();
          img.onload = async () => {
            const canvas = canvasRef.current;
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);

            setStatus("Analyzing image...");
            let desc = "an unidentified object";
            try { desc = await describeImage(base64, mime); } catch(err) { console.warn("Vision failed:", err.message); }

            setStatus("Applying guac effect...");
            applyGuacEffect(ctx, canvas.width, canvas.height);
            setProcessedSrc(canvas.toDataURL());

            setStatus("Generating recipe...");
            try {
              const r = await generateRecipe(fileName, desc);
              setRecipe(r);
            } catch(err) {
              console.error(err);
              setRecipe({
                title: fileName + " Guacamole (something broke)",
                servings: "serves 0",
                steps: ["Error: " + err.message],
                warning: "⚠️ The guac oracle is down."
              });
            }
            setLoading(false);
            setStatus("");
          };
          img.src = src;
        };
        reader.readAsDataURL(file);
      }

      const s = {
        wrap: { maxWidth: 1000, margin: "0 auto" },
        h1: { fontSize: 48, color: "#2d5016", textAlign: "center", marginBottom: 8 },
        sub: { fontSize: 18, color: "#558b2f", textAlign: "center", marginBottom: 40 },
        btnWrap: { display: "flex", justifyContent: "center", marginBottom: 40 },
        btn: { padding: "16px 32px", background: "#558b2f", color: "white", borderRadius: 8, fontSize: 16, fontWeight: "bold", cursor: "pointer", border: "none" },
        grid: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 30 },
        box: { background: "white", borderRadius: 8, overflow: "hidden", boxShadow: "0 2px 8px rgba(0,0,0,.1)" },
        boxLabel: { padding: 12, background: "#f5f5f5", fontWeight: "bold", color: "#558b2f", fontSize: 14 },
        img: { width: "100%", maxHeight: 400, objectFit: "contain", display: "block" },
        recipeBox: { background: "white", padding: 30, borderRadius: 8, boxShadow: "0 2px 8px rgba(0,0,0,.1)" },
        title: { fontSize: 26, color: "#2d5016", marginBottom: 6 },
        serving: { color: "#666", fontStyle: "italic", marginBottom: 16 },
        stepsLabel: { fontSize: 16, color: "#558b2f", fontWeight: "bold", marginBottom: 8 },
        ol: { paddingLeft: 20, color: "#333", lineHeight: 1.9 },
        li: { marginBottom: 8 },
        warn: { marginTop: 20, paddingTop: 16, borderTop: "1px solid #eee", color: "#888", fontSize: 14 },
        status: { textAlign: "center", color: "#558b2f", fontStyle: "italic", marginBottom: 20 }
      };

      return (
        <div style={s.wrap}>
          <h1 style={s.h1}>🥑 Guacamole Converter</h1>
          <p style={s.sub}>Transform any image into a guacamole recipe</p>
          <div style={s.btnWrap}>
            <label>
              <input type="file" accept="image/*" onChange={handleUpload} style={{display:"none"}} />
              <span style={s.btn}>{loading ? "🥑 " + status : "📸 Choose Image"}</span>
            </label>
          </div>

          {(originalSrc || processedSrc) && (
            <div style={s.grid}>
              <div style={s.box}>
                <div style={s.boxLabel}>Original</div>
                {originalSrc && <img src={originalSrc} style={s.img} alt="original" />}
              </div>
              <div style={s.box}>
                <div style={s.boxLabel}>Guacamole'd ✨</div>
                {processedSrc && <img src={processedSrc} style={s.img} alt="processed" />}
              </div>
            </div>
          )}

          {recipe && (
            <div style={s.recipeBox}>
              <div style={s.title}>{recipe.title}</div>
              <div style={s.serving}>{recipe.servings}</div>
              <div style={s.stepsLabel}>Instructions:</div>
              <ol style={s.ol}>
                {recipe.steps.map((step, i) => <li key={i} style={s.li}>{step}</li>)}
              </ol>
              <div style={s.warn}>{recipe.warning}</div>
            </div>
          )}

          <canvas ref={canvasRef} style={{display:"none"}} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
