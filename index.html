<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥑 Guacamole Converter</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Segoe UI", sans-serif; background: linear-gradient(135deg, #f0f4e8, #e0edd0); min-height: 100vh; padding: 40px 20px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;

const WORKER = "https://guac.gentlemenssausage.workers.dev";
const GROQ_RECIPE = "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";
const GROQ_VISION = "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";

async function groq(key, body) {
  const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST", mode: "cors",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function describeImage(b64, mime) {
  try {
    const d = await groq(GROQ_VISION, {
      model: "qwen/qwen3.6-27b", max_tokens: 150,
      messages: [{ role: "user", content: [
        { type: "image_url", image_url: { url: "data:" + mime + ";base64," + b64 } },
        { type: "text", text: "In 1-2 sentences, describe the specific objects and scene in this image very precisely." }
      ]}]
    });
    return d.choices[0].message.content.trim();
  } catch(e) { return "an unidentified object"; }
}

async function makeRecipe(desc) {
  const d = await groq(GROQ_RECIPE, {
    model: "llama-3.3-70b-versatile", max_tokens: 600,
    messages: [{ role: "user", content:
      `You are an unhinged guacamole recipe writer. The image shows: ${desc}

Treat the specific objects in the image AS guacamole ingredients. Reference real parts of what you see.
Respond ONLY with raw JSON, nothing else:
{"title":"funny title","servings":"weird serving size","steps":["step 1","step 2","step 3","step 4","step 5"],"warning":"⚠️ warning"}`
    }]
  });
  const txt = d.choices[0].message.content.trim();
  const m = txt.match(/\{[\s\S]*\}/);
  return JSON.parse(m[0]);
}

// Load a real guac photo through the worker
async function fetchGuacPixels(w, h, setStatus) {
  setStatus("🔍 Searching for real guac photos...");
  
  // Get list of real guac image URLs from Wikimedia via worker
  const searchRes = await fetch(WORKER + "/search");
  const { urls } = await searchRes.json();
  
  if (!urls || urls.length === 0) throw new Error("no guac images found");
  
  // Shuffle and try each one
  const shuffled = urls.sort(() => Math.random() - 0.5);
  
  for (const imgUrl of shuffled) {
    try {
      setStatus("📥 Loading guac photo...");
      const proxied = WORKER + "/proxy?url=" + encodeURIComponent(imgUrl);
      
      const pixels = await new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          const ctx = c.getContext("2d");
          // Draw and tile/scale guac photo to fill canvas
          ctx.drawImage(img, 0, 0, w, h);
          resolve(ctx.getImageData(0, 0, w, h).data);
        };
        img.onerror = () => reject(new Error("img load failed"));
        setTimeout(() => reject(new Error("timeout")), 7000);
        img.src = proxied;
      });
      
      return pixels;
    } catch(e) {
      console.warn("skipping:", imgUrl, e.message);
    }
  }
  throw new Error("all guac photos failed");
}

// THE REAL ALGORITHM
// Every single pixel in your image gets replaced by a pixel from a real guac photo.
// The replacement is chosen so that the brightness (luminance) of every pixel is preserved.
// Dark pixels in your image → dark pixels from guac photo
// Bright pixels in your image → bright pixels from guac photo
// Result: your image's structure entirely made of real guac pixels
async function guacamolify(srcCanvas, setStatus) {
  const ctx = srcCanvas.getContext("2d");
  const w = srcCanvas.width, h = srcCanvas.height;
  const N = w * h;

  // Get source pixels
  const src = ctx.getImageData(0, 0, w, h).data;

  // Fetch real guac pixels from Wikimedia
  let guac;
  try {
    guac = await fetchGuacPixels(w, h, setStatus);
  } catch(e) {
    console.warn("Using procedural fallback:", e.message);
    setStatus("🥑 Generating guac texture...");
    guac = proceduralGuac(w, h);
  }

  setStatus("🔢 Sorting pixels by brightness...");

  // Compute luminance of every source pixel
  const srcLum = new Float32Array(N);
  for (let i = 0; i < N; i++)
    srcLum[i] = src[i*4]*0.299 + src[i*4+1]*0.587 + src[i*4+2]*0.114;

  // Compute luminance of every guac pixel
  const guacLum = new Float32Array(N);
  for (let i = 0; i < N; i++)
    guacLum[i] = guac[i*4]*0.299 + guac[i*4+1]*0.587 + guac[i*4+2]*0.114;

  // Sort both by luminance — get the rank order
  setStatus("🥑 Rearranging every pixel...");
  const srcRank  = Array.from({length: N}, (_, i) => i).sort((a, b) => srcLum[a]  - srcLum[b]);
  const guacRank = Array.from({length: N}, (_, i) => i).sort((a, b) => guacLum[a] - guacLum[b]);

  // Build output: src pixel at rank k gets replaced by guac pixel at rank k
  // This means: the darkest pixel in your image → darkest guac pixel
  //             the 2nd darkest → 2nd darkest guac pixel, etc.
  // Every single pixel position keeps its brightness ranking
  // but the actual color comes from the real guac photo
  const out = new Uint8ClampedArray(N * 4);
  for (let rank = 0; rank < N; rank++) {
    const dstIdx = srcRank[rank];   // where to put this pixel in output
    const srcIdx = guacRank[rank];  // which guac pixel to use
    out[dstIdx*4]   = guac[srcIdx*4];
    out[dstIdx*4+1] = guac[srcIdx*4+1];
    out[dstIdx*4+2] = guac[srcIdx*4+2];
    out[dstIdx*4+3] = 255;
  }

  const result = new ImageData(out, w, h);
  ctx.putImageData(result, 0, 0);
}

function proceduralGuac(w, h) {
  const d = new Uint8ClampedArray(w * h * 4);
  const cols = [[20,35,5],[45,65,8],[72,95,15],[95,125,20],[130,165,30],[160,200,40],[185,220,55],[210,235,75],[55,40,10],[80,55,12]];
  const s1=Math.random()*999, s2=Math.random()*999;
  const f1=0.02+Math.random()*0.03, f2=0.05+Math.random()*0.04;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const n = Math.sin((x+s1)*f1)*Math.cos((y+s1)*f1)*0.6 + Math.sin((x+s2)*f2)*Math.sin((y+s2)*f2)*0.4;
    const t = (n+1)/2;
    const ci = Math.floor(t*(cols.length-1));
    const fr = t*(cols.length-1)-ci;
    const c0=cols[ci], c1=cols[Math.min(ci+1,cols.length-1)];
    const i=(y*w+x)*4;
    d[i]=Math.round(c0[0]+(c1[0]-c0[0])*fr);
    d[i+1]=Math.round(c0[1]+(c1[1]-c0[1])*fr);
    d[i+2]=Math.round(c0[2]+(c1[2]-c0[2])*fr);
    d[i+3]=255;
  }
  return d;
}

function App() {
  const [orig, setOrig] = useState(null);
  const [result, setResult] = useState(null);
  const [recipe, setRecipe] = useState(null);
  const [loading, setLoading] = useState(false);
  const [status, setStatus] = useState("");
  const canvasRef = useRef(null);

  async function upload(e) {
    const file = e.target.files[0];
    if (!file) return;
    setLoading(true); setRecipe(null); setResult(null);

    const reader = new FileReader();
    reader.onload = async ev => {
      const src = ev.target.result;
      setOrig(src);
      const b64 = src.split(",")[1];
      const mime = file.type || "image/jpeg";

      const img = new Image();
      img.onload = async () => {
        const canvas = canvasRef.current;
        const MAX = 500;
        const scale = Math.min(1, MAX / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

        setStatus("👁️ Analyzing image...");
        const desc = await describeImage(b64, mime);

        await guacamolify(canvas, setStatus);
        setResult(canvas.toDataURL());

        setStatus("📝 Writing unhinged recipe...");
        try {
          setRecipe(await makeRecipe(desc));
        } catch(e) {
          setRecipe({ title: "Mystery Guac", servings: "unknown", steps: [e.message], warning: "⚠️ recipe broke" });
        }
        setLoading(false); setStatus("");
      };
      img.src = src;
    };
    reader.readAsDataURL(file);
  }

  const S = {
    wrap: { maxWidth: 1100, margin: "0 auto" },
    h1: { fontSize: 52, color: "#2d5016", textAlign: "center", marginBottom: 8, fontWeight: 900 },
    sub: { fontSize: 18, color: "#558b2f", textAlign: "center", marginBottom: 40 },
    btnWrap: { display: "flex", justifyContent: "center", marginBottom: 40 },
    btn: { padding: "18px 40px", background: "#558b2f", color: "white", borderRadius: 10, fontSize: 18, fontWeight: "bold", cursor: "pointer", border: "none", boxShadow: "0 4px 12px rgba(85,139,47,.4)" },
    grid: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, marginBottom: 30 },
    box: { background: "white", borderRadius: 12, overflow: "hidden", boxShadow: "0 4px 16px rgba(0,0,0,.12)" },
    lbl: { padding: "12px 16px", background: "#f5f5f5", fontWeight: "bold", color: "#558b2f", fontSize: 14, letterSpacing: 1 },
    img: { width: "100%", maxHeight: 450, objectFit: "contain", display: "block" },
    rec: { background: "white", padding: 36, borderRadius: 12, boxShadow: "0 4px 16px rgba(0,0,0,.12)" },
    rt: { fontSize: 28, color: "#2d5016", marginBottom: 8, fontWeight: 800 },
    rs: { color: "#666", fontStyle: "italic", marginBottom: 20 },
    rl: { fontSize: 14, color: "#558b2f", fontWeight: "bold", marginBottom: 10, textTransform: "uppercase", letterSpacing: 1 },
    ol: { paddingLeft: 22, color: "#333", lineHeight: 2 },
    li: { marginBottom: 8 },
    rw: { marginTop: 20, paddingTop: 16, borderTop: "1px solid #eee", color: "#888", fontSize: 14 },
  };

  return (
    <div style={S.wrap}>
      <h1 style={S.h1}>🥑 Guacamole Converter</h1>
      <p style={S.sub}>Every pixel rearranged using real guacamole photos</p>
      <div style={S.btnWrap}>
        <label>
          <input type="file" accept="image/*" onChange={upload} style={{display:"none"}} />
          <span style={S.btn}>{loading ? status : "📸 Choose Image"}</span>
        </label>
      </div>
      {(orig || result) && (
        <div style={S.grid}>
          <div style={S.box}><div style={S.lbl}>ORIGINAL</div>{orig && <img src={orig} style={S.img} alt="orig" />}</div>
          <div style={S.box}><div style={S.lbl}>GUACAMOLE'D ✨</div>{result && <img src={result} style={S.img} alt="result" />}</div>
        </div>
      )}
      {recipe && (
        <div style={S.rec}>
          <div style={S.rt}>{recipe.title}</div>
          <div style={S.rs}>{recipe.servings}</div>
          <div style={S.rl}>Instructions</div>
          <ol style={S.ol}>{recipe.steps.map((s,i) => <li key={i} style={S.li}>{s}</li>)}</ol>
          <div style={S.rw}>{recipe.warning}</div>
        </div>
      )}
      <canvas ref={canvasRef} style={{display:"none"}} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
